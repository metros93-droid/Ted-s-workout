    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .progress-ring__circle {
            transform: rotate(90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.1s linear;
        }
        
        .timer-active {
            animation: pulse-glow 3s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.3)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.6)); }
        }

        body.theme-dark { background-color: #090d16; color: #f1f5f9; }
        body.theme-dark .app-container { background-color: #111827; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
        body.theme-dark input, body.theme-dark select { background-color: #1f2937 !important; color: #f8fafc !important; border-color: #374151 !important; }
        body.theme-dark .item-card { background-color: #161e2e !important; border-color: #2d3748 !important; }

        body.theme-neobrutalism { background-color: #f3f4f6; color: #111; }
        body.theme-neobrutalism .app-container { background-color: #ffffff; border: 3px solid #111; box-shadow: 6px 6px 0px #111; border-radius: 1.5rem; }
        body.theme-neobrutalism button, body.theme-neobrutalism input { border: 2px solid #111 !important; box-shadow: 3px 3px 0px #111; border-radius: 0.75rem; font-weight: 700; transition: transform 0.1s, box-shadow 0.1s; }
        body.theme-neobrutalism button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #111; }
        body.theme-neobrutalism .item-card { background-color: #fdf4ff !important; border: 2px solid #111 !important; box-shadow: 3px 3px 0px #111; }

        body.theme-glass { background: radial-gradient(circle at top left, #3b82f6, #6366f1, #9333ea); background-attachment: fixed; color: #fff; }
        body.theme-glass .app-container { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.25); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3); }
        body.theme-glass input, body.theme-glass select { background: rgba(255, 255, 255, 0.15) !important; color: #fff !important; border: 1px solid rgba(255, 255, 255, 0.3) !important; }
        body.theme-glass input::placeholder { color: rgba(255, 255, 255, 0.5); }
        body.theme-glass select option { background-color: #1e1b4b !important; color: #ffffff !important; }
        body.theme-glass .item-card { background: rgba(255, 255, 255, 0.08) !important; border: 1px solid rgba(255, 255, 255, 0.18) !important; }

        body.theme-minimal { background-color: #f8fafc; color: #0f172a; }
        body.theme-minimal .app-container { background-color: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05); }
        body.theme-minimal input, body.theme-minimal select { background-color: #f8fafc; border-color: #cbd5e1; }
        body.theme-minimal .item-card { background-color: #f8fafc; border-color: #e2e8f0; }

        .item-card { cursor: default; user-select: none; }
        .item-card.dragging { opacity: 0.5; transform: scale(1.02); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); z-index: 50; }
        .drag-handle { cursor: grab; touch-action: none; }
        .drag-handle:active { cursor: grabbing; }
    </style>
</head>
<body class="theme-minimal min-h-screen flex flex-col items-center justify-center p-2 sm:p-6">

    <div class="w-full max-w-4xl app-container rounded-3xl p-3 sm:p-8 flex flex-col relative transition-all duration-300 my-auto">

            <div class="flex items-center gap-3">
                <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 flex flex-col items-center justify-center shadow-lg shadow-indigo-500/30 text-white flex-shrink-0 relative overflow-hidden group p-1 text-center">
                    <div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>

                </div>
                <div>
                    <h1 class="text-xl sm:text-3xl font-extrabold tracking-tight">TeD의 워크아웃 타이머</h1>
                    <div class="flex items-center gap-1.5 mt-0.5">

            </div>
            
            <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap justify-end">
                <button id="ttsToggleBtn" class="flex items-center justify-center gap-1.5 w-[92px] sm:w-[100px] py-1.5 sm:py-2 rounded-xl sm:rounded-2xl border border-indigo-200 bg-indigo-50 text-indigo-600 dark:border-indigo-800/50 dark:bg-indigo-500/10 dark:text-indigo-300 transition-all text-xs font-bold hover:bg-indigo-100 active:scale-95">
                    <span id="ttsIcon" class="w-4 text-center flex-shrink-0">🔊</span>
                    <span id="ttsText" class="w-10 text-center flex-shrink-0">음성</span>
                </button>
                <div class="flex items-center gap-1 bg-black/5 dark:bg-white/10 px-2.5 py-1.5 sm:px-3.5 sm:py-2 rounded-xl sm:rounded-2xl border border-gray-300/20">
                    <span class="text-xs font-semibold opacity-70">스타일:</span>
                    <select id="themeSelector" class="bg-transparent text-xs font-bold outline-none cursor-pointer py-0.5 px-1">
                        <option value="theme-minimal">클린 미니멀</option>
                        <option value="theme-dark">모던 다크</option>
                        <option value="theme-neobrutalism">네오 브루탈</option>
                        <option value="theme-glass">글래스모피즘</option>
                    </select>
                </div>

                <button id="presetBtn" class="text-xs font-semibold px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl sm:rounded-2xl border border-indigo-400/40 text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/10 transition-all hover:opacity-80 active:scale-95">프리셋</button>
                <button id="loadBtn" class="text-xs font-semibold px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl sm:rounded-2xl border transition-all hover:opacity-80 active:scale-95 border-gray-300/30">불러오기</button>
                <button id="saveBtn" class="text-xs font-semibold px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl sm:rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-500/25 hover:bg-indigo-700 transition-all active:scale-95">저장</button>
                <button id="resetAllBtn" class="text-xs font-semibold px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl sm:rounded-2xl border border-red-400/40 text-red-500 hover:bg-red-500 hover:text-white transition-all active:scale-95">초기화</button>
            </div>
        </div>

        <div id="settingsPanel" class="flex flex-col flex-1">
            <!-- Cycle Configuration Bar -->
            <div class="mb-3.5 p-3 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex flex-col sm:flex-row items-center justify-between gap-3">
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <span class="text-xs sm:text-sm font-bold text-indigo-600 dark:text-indigo-400 flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        전체 루틴 사이클 반복:
                    </span>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <div class="flex items-center gap-1 bg-white/50 dark:bg-black/20 px-3 py-1.5 rounded-xl border border-indigo-300/30">
                        <input type="number" id="routineCycles" class="w-12 text-center font-extrabold text-xs sm:text-sm bg-transparent outline-none" min="1" max="20" value="1">
                        <span class="text-xs font-bold opacity-80">사이클 반복</span>
                    </div>
                    <div class="flex items-center gap-1.5 bg-white/50 dark:bg-black/20 px-3 py-1.5 rounded-xl border border-indigo-300/30">
                        <span class="text-xs font-bold opacity-80">사이클 휴식:</span>
                        <input type="number" id="cycleRestDuration" class="w-12 text-center font-extrabold text-xs sm:text-sm bg-transparent outline-none" min="0" max="300" value="30">
                        <span class="text-xs font-bold opacity-80">초</span>
                    </div>
                </div>
            </div>

            <div id="routineList" class="space-y-2.5 sm:space-y-3.5 flex-1 overflow-y-auto mb-4 sm:mb-6 pr-1 max-h-[46vh]">
            </div>

            <div class="flex flex-col md:flex-row gap-3 mt-auto pt-3 sm:pt-4 border-t border-gray-200/15">
                <button id="addStretchBtn" class="py-2.5 sm:py-3 px-4 border-2 border-dashed border-indigo-400/50 rounded-2xl hover:bg-indigo-500/10 transition-all font-semibold flex items-center justify-center gap-2 text-xs sm:text-sm md:w-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-80" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />

                    <div class="flex items-center bg-black/5 dark:bg-white/10 px-3.5 py-2 sm:py-2.5 rounded-2xl border border-gray-300/20 justify-between flex-1">
                        <span class="text-xs sm:text-sm font-bold opacity-80 whitespace-nowrap mr-2">시작 단계:</span>
                        <select id="startStepSelector" class="bg-transparent text-xs sm:text-sm font-extrabold outline-none cursor-pointer py-1 px-1 text-right w-full">
                            <option value="0">1번째부터</option>
                        </select>
                    </div>
                    <button id="startRoutineBtn" class="flex-1 py-3 sm:py-3.5 px-6 bg-indigo-600 text-white rounded-2xl shadow-xl shadow-indigo-500/30 hover:bg-indigo-700 transition-all font-bold text-sm sm:text-base tracking-wide active:scale-[0.98] whitespace-nowrap">
                        루틴 시작하기
                    </button>
                </div>
            </div>
            
            <div id="totalTimePreview" class="mt-2.5 sm:mt-3 py-2 px-3.5 sm:py-2.5 sm:px-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-between text-xs sm:text-sm font-semibold text-indigo-600 dark:text-indigo-400">
                <span class="flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>예상 총 시간:</span>
                </span>
                <span id="totalTimePreviewValue" class="font-extrabold">0초</span>
            </div>
        </div>

        <div id="timerPanel" class="flex flex-col items-center justify-center hidden relative py-2 sm:py-4 w-full">
            <div class="w-full flex justify-between items-start mb-3 gap-2">
                <button id="backToSettingsBtn" class="p-2.5 rounded-2xl border border-gray-300/30 hover:bg-black/10 transition-all flex items-center gap-1.5 text-xs font-semibold flex-shrink-0" title="설정으로 돌아가기">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    설정으로
                </button>
                
                <div class="flex flex-col items-end gap-1.5">
                    <div class="flex items-center gap-1.5 flex-wrap justify-end">
                        <div id="overallProgress" class="text-xs sm:text-sm font-bold opacity-75 px-3 py-1 bg-black/5 dark:bg-white/10 rounded-xl">진행 단계: 0 / 0</div>
                        <div id="cycleIndicatorBadge" class="text-[11px] font-extrabold px-2.5 py-1 bg-indigo-500/15 text-indigo-600 dark:text-indigo-400 rounded-xl border border-indigo-500/20">사이클 1 / 1 회차</div>
                    </div>
                    <div id="totalRemainingTimeContainer" class="px-2.5 py-1 bg-black/5 dark:bg-white/10 border border-gray-300/20 rounded-xl text-[11px] sm:text-xs font-semibold opacity-90 flex items-center gap-1 transition-all">
                        <span class="flex items-center gap-1 opacity-85 whitespace-nowrap">
                            <svg class="w-3.5 h-3.5 text-indigo-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span>남은 총시간:</span>
                        </span>
                        <span id="totalRemainingTimeText" class="font-extrabold tabular-nums text-indigo-600 dark:text-indigo-400">0분 0초</span>
                    </div>
                </div>
            </div>

            <h2 id="currentStretchName" class="text-2xl sm:text-4xl font-extrabold mb-1 mt-2 text-center truncate w-full px-4">준비</h2>
            <div id="currentPhaseInfo" class="text-base sm:text-lg font-semibold mb-4 sm:mb-6 h-6 text-center text-indigo-500">대기 중</div>

            <div id="timerCircleContainer" class="relative w-44 h-44 sm:w-60 sm:h-60 flex items-center justify-center mb-6">

                    <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-opacity="0.1" stroke-width="5"></circle>
                    <circle id="progressRing" cx="50" cy="50" r="45" fill="none" stroke="#6366f1" stroke-width="5" stroke-dasharray="282.7" stroke-dashoffset="0" class="progress-ring__circle" stroke-linecap="round"></circle>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">

                    <span class="text-xs sm:text-sm font-bold opacity-60 uppercase tracking-widest mt-0.5">SECONDS</span>
                </div>
            </div>

                    </svg>
                    <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">

    <div id="saveModal" class="fixed inset-0 bg-black/60 hidden backdrop-blur-md flex items-center justify-center z-60 p-4">

        let sharedAudioCtx = null;
        function getAudioContext() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return null;
            if (!sharedAudioCtx) {
                sharedAudioCtx = new AudioContext();
            }
            if (sharedAudioCtx.state === 'suspended') {
                sharedAudioCtx.resume().catch(() => {});
            }
            return sharedAudioCtx;
        }

        function playCountdownBeep() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(660, ctx.currentTime);
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        function playEndBeep() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;
                
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, now);
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc1.start(now);
                osc1.stop(now + 0.15);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1320, now + 0.15);
                gain2.gain.setValueAtTime(0.3, now + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc2.start(now + 0.15);
                osc2.stop(now + 0.35);
            } catch(e) {}
        }

        function initVoices() {
            if (!('speechSynthesis' in window)) return;
            availableVoices = window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                availableVoices = window.speechSynthesis.getVoices();

            ttsToggleBtn.addEventListener('click', () => {

        function speak(text, isCountDown = false) {
            if (soundMode !== 'voice' || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            const koVoices = availableVoices.filter(v => v.lang.includes('ko') || v.lang.includes('KR'));
            const selectedVoice = koVoices.find(v => v.name.includes('Yuna') || v.name.includes('Google') || v.name.includes('Apple')) || koVoices[0];
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.rate = isCountDown ? 1.0 : 0.95;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        window.showModal = function(message, onConfirm = null, isAlert = false) {
            const modal = document.getElementById('customModal');
            const messageEl = document.getElementById('modalMessage');
            const confirmBtn = document.getElementById('modalConfirmBtn');
            const cancelBtn = document.getElementById('modalCancelBtn');
            if (!modal || !messageEl || !confirmBtn || !cancelBtn) return;

            messageEl.textContent = message;
            modal.classList.remove('hidden');
            if (isAlert) cancelBtn.classList.add('hidden');
            else cancelBtn.classList.remove('hidden');

            const handleConfirm = () => {
                modal.classList.add('hidden');
                cleanup();
                if (onConfirm) onConfirm();
            };
            const handleCancel = () => {
                modal.classList.add('hidden');
                cleanup();
            };
            function cleanup() {
                confirmBtn.removeEventListener('click', handleConfirm);
                cancelBtn.removeEventListener('click', handleCancel);
            }
            confirmBtn.addEventListener('click', handleConfirm);
            cancelBtn.addEventListener('click', handleCancel);
        };

        window.createNewStretchItem = function(defaultData = null, insertAfterElement = null) {
            if (!routineListEl) return;

                name: `운동 ${routineListEl.children.length + 1}`,
                duration: 10, reps: 3, setRest: 5, nextRest: 10
            };

            const itemHTML = `
                <div class="item-card border rounded-2xl p-2.5 sm:p-3 relative group transition-all" id="item-${id}">
                    <div class="flex flex-col gap-2">
                        <div class="flex items-center gap-2">

                                <label class="block text-[10px] sm:text-[11px] font-semibold opacity-70 mb-0.5">운동 이름</label>
                                <input type="text" class="stretch-name w-full rounded-xl py-1.5 px-2.5 border text-xs sm:text-sm font-medium outline-none" value="${data.name}">
                            </div>
                            <div class="flex items-center gap-1 self-end pb-0.5">
                                <button onclick="window.duplicateStretchItem('${id}')" class="text-indigo-500 hover:text-indigo-700 p-2 rounded-xl hover:bg-indigo-500/10 transition-all flex items-center justify-center" title="운동 복사하기">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                    </svg>
                                </button>
                                <div class="drag-handle text-indigo-400 hover:text-indigo-600 p-2 rounded-xl hover:bg-indigo-500/10 transition-all flex items-center justify-center" title="드래그하여 순서 변경">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 8h16M4 16h16" />
                                    </svg>
                                </div>
                                <button onclick="window.removeStretchItem('${id}')" class="text-red-400 hover:text-red-600 p-1.5 rounded-xl hover:bg-red-500/10 transition-all" title="삭제">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-4 gap-1.5 sm:gap-2">
                            <div>
                                <label class="block text-[10px] sm:text-[11px] font-semibold opacity-70 mb-0.5 text-center">진행(초)</label>
                                <input type="number" class="stretch-duration w-full rounded-xl py-1.5 px-1 border text-xs sm:text-sm text-center font-bold outline-none" min="1" value="${data.duration}">
                            </div>
                            <div>
                                <label class="block text-[10px] sm:text-[11px] font-semibold opacity-70 mb-0.5 text-center">세트수</label>
                                <input type="number" class="stretch-reps w-full rounded-xl py-1.5 px-1 border text-xs sm:text-sm text-center font-bold outline-none" min="1" value="${data.reps}">
                            </div>
                            <div>
                                <label class="block text-[10px] sm:text-[11px] font-semibold opacity-70 mb-0.5 text-center">세트휴식</label>
                                <input type="number" class="stretch-set-rest w-full rounded-xl py-1.5 px-1 border text-xs sm:text-sm text-center font-bold outline-none" min="0" value="${data.setRest}">
                            </div>
                            <div>
                                <label class="block text-[10px] sm:text-[11px] font-semibold opacity-70 mb-0.5 text-center">다음휴식</label>
                                <input type="number" class="stretch-next-rest w-full rounded-xl py-1.5 px-1 border text-xs sm:text-sm text-center font-bold outline-none" min="0" value="${data.nextRest}">
                            </div>
                        </div>
                    </div>
                </div>
            `;

            if (insertAfterElement && insertAfterElement.nextElementSibling) {
                insertAfterElement.insertAdjacentHTML('afterend', itemHTML);
                setupDragAndDropForElement(insertAfterElement.nextElementSibling);
            } else if (insertAfterElement) {
                routineListEl.insertAdjacentHTML('beforeend', itemHTML);
                setupDragAndDropForElement(routineListEl.lastElementChild);
            } else {
                routineListEl.insertAdjacentHTML('beforeend', itemHTML);
                routineListEl.scrollTop = routineListEl.scrollHeight;
                setupDragAndDropForElement(routineListEl.lastElementChild);

            updateStartStepSelector();

        window.duplicateStretchItem = function(id) {
            const itemElement = document.getElementById(`item-${id}`);
            if (!itemElement) return;

            const name = itemElement.querySelector('.stretch-name').value.trim() + " (복사)";
            const duration = parseInt(itemElement.querySelector('.stretch-duration').value) || 10;
            const reps = parseInt(itemElement.querySelector('.stretch-reps').value) || 3;
            const setRest = parseInt(itemElement.querySelector('.stretch-set-rest').value) || 0;
            const nextRest = parseInt(itemElement.querySelector('.stretch-next-rest').value) || 0;

            window.createNewStretchItem({ name, duration, reps, setRest, nextRest }, itemElement);
        };

        window.removeStretchItem = function(id) {
            const item = document.getElementById(`item-${id}`);
            if (item && routineListEl.children.length > 1) {
                item.remove();
                updateStartStepSelector();
            } else if (routineListEl && routineListEl.children.length === 1) {
                window.showModal("최소 1개의 항목은 유지되어야 합니다.", null, true);
            }
        };

        let draggedItem = null;
        let autoScrollInterval = null;

        function setupDragAndDropForElement(element) {
            const handle = element.querySelector('.drag-handle');
            if (!handle) return;
            
            handle.addEventListener('mousedown', () => element.setAttribute('draggable', 'true'));
            element.addEventListener('dragstart', (e) => {
                draggedItem = element;
                setTimeout(() => element.classList.add('dragging'), 0);
                e.dataTransfer.effectAllowed = 'move';
            });
            element.addEventListener('dragend', () => {
                element.classList.remove('dragging');
                draggedItem = null;
                element.removeAttribute('draggable');
                stopAutoScroll();
                updateStartStepSelector();
            });

            handle.addEventListener('touchstart', (e) => {
                e.stopPropagation();
                draggedItem = element;
                element.classList.add('dragging');
            }, { passive: false });

            handle.addEventListener('touchmove', (e) => {
                if (!draggedItem) return;
                e.preventDefault();
                const touch = e.touches[0];
                const containerRect = routineListEl.getBoundingClientRect();
                if (touch.clientY < containerRect.top + 50) startAutoScroll(-10);
                else if (touch.clientY > containerRect.bottom - 50) startAutoScroll(10);
                else stopAutoScroll();

                const afterElement = getDragAfterElement(routineListEl, touch.clientY);
                if (afterElement == null) routineListEl.appendChild(draggedItem);
                else routineListEl.insertBefore(draggedItem, afterElement);
            }, { passive: false });

            handle.addEventListener('touchend', () => {
                if (draggedItem) draggedItem.classList.remove('dragging');
                draggedItem = null;
                stopAutoScroll();
                updateStartStepSelector();
            });

            element.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const containerRect = routineListEl.getBoundingClientRect();
                if (e.clientY < containerRect.top + 50) startAutoScroll(-10);
                else if (e.clientY > containerRect.bottom - 50) startAutoScroll(10);
                else stopAutoScroll();

                const afterElement = getDragAfterElement(routineListEl, e.clientY);
                if (afterElement == null && draggedItem) routineListEl.appendChild(draggedItem);
                else if (draggedItem) routineListEl.insertBefore(draggedItem, afterElement);
            });
        }

        function startAutoScroll(speed) {
            if (autoScrollInterval) return;
            autoScrollInterval = setInterval(() => { if (routineListEl) routineListEl.scrollTop += speed; }, 20);
        }
        function stopAutoScroll() {
            if (autoScrollInterval) { clearInterval(autoScrollInterval); autoScrollInterval = null; }
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.item-card:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                return (offset < 0 && offset > closest.offset) ? { offset: offset, element: child } : closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function updateStartStepSelector() {
            if (!startStepSelector || !routineListEl) return;
            const items = routineListEl.children;
            const currentSelected = startStepSelector.value;
            startStepSelector.innerHTML = '';
            for (let i = 0; i < items.length; i++) {
                const nameInput = items[i].querySelector('.stretch-name');
                const name = nameInput ? nameInput.value.trim() : `운동 ${i+1}`;
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${i+1}. ${name || '운동 ' + (i+1)}`;
                startStepSelector.appendChild(opt);
            }
            startStepSelector.value = (parseInt(currentSelected) < items.length) ? currentSelected : "0";
            updateTotalTimePreview();
        }

        function calculateTotalRoutineTime(startIndex = 0) {
            if (!routineListEl) return 0;
            const items = routineListEl.children;
            let oneCycleSeconds = 0;
            for (let i = startIndex; i < items.length; i++) {
                const duration = parseInt(items[i].querySelector('.stretch-duration').value) || 0;
                const reps = parseInt(items[i].querySelector('.stretch-reps').value) || 1;
                const setRest = parseInt(items[i].querySelector('.stretch-set-rest').value) || 0;
                const nextRest = parseInt(items[i].querySelector('.stretch-next-rest').value) || 0;

                for (let r = 1; r <= reps; r++) {
                    oneCycleSeconds += duration;
                    if (r < reps) oneCycleSeconds += setRest;
                }
                if (i < items.length - 1) oneCycleSeconds += nextRest;
            }

            const cycles = parseInt(routineCyclesInput ? routineCyclesInput.value : 1) || 1;
            const cycleRest = parseInt(cycleRestDurationInput ? cycleRestDurationInput.value : 0) || 0;
            
            let totalSeconds = oneCycleSeconds * cycles;
            if (cycles > 1) {
                totalSeconds += cycleRest * (cycles - 1);
            }
            return totalSeconds;
        }

        function updateTotalTimePreview() {
            if (!startStepSelector) return;
            const totalSec = calculateTotalRoutineTime(parseInt(startStepSelector.value) || 0);
            const mins = Math.floor(totalSec / 60);
            const secs = totalSec % 60;
            const previewEl = document.getElementById('totalTimePreviewValue');
            if (previewEl) previewEl.textContent = mins > 0 ? `${mins}분 ${secs}초` : `${secs}초`;
        }

        if (startStepSelector) startStepSelector.addEventListener('change', updateTotalTimePreview);
        if (routineCyclesInput) routineCyclesInput.addEventListener('input', updateTotalTimePreview);
        if (cycleRestDurationInput) cycleRestDurationInput.addEventListener('input', updateTotalTimePreview);
        
        if (routineListEl) {
            routineListEl.addEventListener('input', (e) => {
                if (e.target.matches('.stretch-name, .stretch-duration, .stretch-reps, .stretch-set-rest, .stretch-next-rest')) {
                    updateStartStepSelector();
                }
            });
        }

        window.openPresetModal = () => {
            const modal = document.getElementById('presetModal');
            const container = document.getElementById('presetListContainer');
            modal.classList.remove('hidden');
            container.innerHTML = '';

            workoutPresets.forEach((preset) => {
                const div = document.createElement('div');
                div.className = 'p-3.5 item-card rounded-2xl border hover:opacity-95 transition-all cursor-pointer flex flex-col gap-1.5';
                div.onclick = () => {
                    routineListEl.innerHTML = '';
                    preset.items.forEach(item => window.createNewStretchItem(item));
                    if (routineCyclesInput) routineCyclesInput.value = preset.cycles || 1;
                    if (cycleRestDurationInput) cycleRestDurationInput.value = preset.cycleRest || 0;
                    window.closePresetModal();
                    updateTotalTimePreview();
                    window.showModal(`'${preset.title}' 프리셋을 불러왔습니다!`, null, true);
                };

                let itemsSummary = preset.items.map(i => i.name).join(', ');
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-sm text-indigo-600 dark:text-indigo-400">${preset.title}</span>
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-500">사이클 ${preset.cycles || 1}회 / 운동 ${preset.items.length}개</span>
                    </div>
                    <p class="text-xs opacity-75">${preset.desc}</p>
                    <p class="text-[11px] opacity-50 truncate">구성: ${itemsSummary}</p>
                `;
                container.appendChild(div);
            });
        };
        window.closePresetModal = () => document.getElementById('presetModal').classList.add('hidden');

        window.openSaveModal = () => {
            document.getElementById('saveRoutineName').value = '';
            document.getElementById('saveModalError').textContent = '';
            document.getElementById('saveModal').classList.remove('hidden');
        };
        window.closeSaveModal = () => document.getElementById('saveModal').classList.add('hidden');

        window.confirmSaveRoutine = () => {
            const nameInput = document.getElementById('saveRoutineName').value.trim();
            const errorEl = document.getElementById('saveModalError');
            if (!nameInput) { errorEl.textContent = '루틴 이름을 입력해주세요.'; return; }

            const items = routineListEl.children;
            const routineData = [];
            for (let i = 0; i < items.length; i++) {
                routineData.push({
                    name: items[i].querySelector('.stretch-name').value.trim(),
                    duration: parseInt(items[i].querySelector('.stretch-duration').value) || 10,
                    reps: parseInt(items[i].querySelector('.stretch-reps').value) || 3,
                    setRest: parseInt(items[i].querySelector('.stretch-set-rest').value) || 0,
                    nextRest: parseInt(items[i].querySelector('.stretch-next-rest').value) || 0
                });
            }

            const cycles = parseInt(routineCyclesInput ? routineCyclesInput.value : 1) || 1;
            const cycleRest = parseInt(cycleRestDurationInput ? cycleRestDurationInput.value : 0) || 0;

            try {
                const savedRoutines = JSON.parse(localStorage.getItem('ted_workout_routines_local_v2') || '{}');
                savedRoutines[nameInput] = { cycles, cycleRest, items: routineData };
                localStorage.setItem('ted_workout_routines_local_v2', JSON.stringify(savedRoutines));
                window.closeSaveModal();
                window.showModal("루틴 및 사이클 설정이 기기에 안전하게 저장되었습니다.", null, true);
            } catch(e) {
                errorEl.textContent = '저장 중 오류가 발생했습니다.';
            }
        };

        window.openLoadModal = () => {
            const loadModal = document.getElementById('loadModal');
            const listEl = document.getElementById('routinesList');
            loadModal.classList.remove('hidden');
            listEl.innerHTML = '<div class="text-center opacity-60 py-6 text-sm font-medium">목록을 불러오는 중...</div>';
            
            try {
                const savedRoutines = JSON.parse(localStorage.getItem('ted_workout_routines_local_v2') || '{}');
                const keys = Object.keys(savedRoutines);
                if (keys.length === 0) {
                    listEl.innerHTML = '<div class="text-center opacity-60 py-6 text-sm font-medium">저장된 루틴이 없습니다.</div>';
                    return;
                }
                listEl.innerHTML = '';
                keys.forEach(routineName => {
                    const routinePackage = savedRoutines[routineName];
                    const routineData = routinePackage.items || routinePackage;
                    const cycles = routinePackage.cycles || 1;
                    const cycleRest = routinePackage.cycleRest || 0;

                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center p-3.5 item-card rounded-2xl border hover:opacity-95 transition-all cursor-pointer';
                    item.onclick = () => {
                        routineListEl.innerHTML = '';
                        routineData.forEach(r => window.createNewStretchItem(r));
                        if (routineCyclesInput) routineCyclesInput.value = cycles;
                        if (cycleRestDurationInput) cycleRestDurationInput.value = cycleRest;
                        window.closeLoadModal();
                        updateTotalTimePreview();
                        window.showModal(`'${routineName}' 루틴을 불러왔습니다.`, null, true);
                    };
                    item.innerHTML = `<div><div class="font-bold text-sm">${routineName}</div><div class="text-xs opacity-60 mt-0.5">사이클 ${cycles}회 • 운동 ${routineData.length}개 항목</div></div>`;
                    
                    const delBtn = document.createElement('button');
                    delBtn.className = 'text-red-400 hover:text-red-600 p-2 rounded-xl hover:bg-red-500/10 transition-colors';
                    delBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>`;
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        window.showModal(`'${routineName}' 루틴을 삭제하시겠습니까?`, () => {
                            delete savedRoutines[routineName];
                            localStorage.setItem('ted_workout_routines_local_v2', JSON.stringify(savedRoutines));
                            item.remove();
                            updateStartStepSelector();
                            if(Object.keys(savedRoutines).length === 0) {
                                listEl.innerHTML = '<div class="text-center opacity-60 py-6 text-sm font-medium">저장된 루틴이 없습니다.</div>';
                            }
                        });
                    };
                    item.appendChild(delBtn);
                    listEl.appendChild(item);
                });
            } catch (e) {
                listEl.innerHTML = '<div class="text-center text-red-400 py-6 text-sm font-medium">목록을 불러오지 못했습니다.</div>';
            }
        };
        window.closeLoadModal = () => document.getElementById('loadModal').classList.add('hidden');

        // Initialize default item
        window.createNewStretchItem();

        if (addStretchBtn) addStretchBtn.addEventListener('click', () => window.createNewStretchItem());
        if (document.getElementById('presetBtn')) document.getElementById('presetBtn').addEventListener('click', window.openPresetModal);
        if (document.getElementById('saveBtn')) document.getElementById('saveBtn').addEventListener('click', window.openSaveModal);
        if (document.getElementById('loadBtn')) document.getElementById('loadBtn').addEventListener('click', window.openLoadModal);
        if (resetAllBtn) resetAllBtn.addEventListener('click', () => window.showModal("모든 설정을 초기화하시겠습니까?", () => { routineListEl.innerHTML = ''; window.createNewStretchItem(); if(routineCyclesInput) routineCyclesInput.value=1; if(cycleRestDurationInput) cycleRestDurationInput.value=30; updateTotalTimePreview(); }));

        if (startRoutineBtn) {
            startRoutineBtn.addEventListener('click', () => {
                getAudioContext();
                routine = [];
                const items = routineListEl.children;
                let isValid = true;
                for (let i = 0; i < items.length; i++) {
                    const name = items[i].querySelector('.stretch-name').value.trim();
                    const duration = parseInt(items[i].querySelector('.stretch-duration').value);
                    const reps = parseInt(items[i].querySelector('.stretch-reps').value);
                    const setRest = parseInt(items[i].querySelector('.stretch-set-rest').value) || 0;
                    const nextRest = parseInt(items[i].querySelector('.stretch-next-rest').value) || 0;

                    if (!name || isNaN(duration) || duration <= 0 || isNaN(reps) || reps <= 0) {
                        window.showModal(`${i+1}번째 항목의 설정값을 확인해주세요. (시간/횟수는 1 이상)`, null, true);
                        isValid = false;
                        break;
                    }
                    routine.push({ name, duration, reps, setRest, nextRest });
                }

                if (isValid && routine.length > 0) {
                    totalCyclesSetting = parseInt(routineCyclesInput ? routineCyclesInput.value : 1) || 1;
                    cycleRestSetting = parseInt(cycleRestDurationInput ? cycleRestDurationInput.value : 0) || 0;

                    settingsPanel.classList.add('hidden');
                    timerPanel.classList.remove('hidden');
                    startTimerExecution(parseInt(startStepSelector.value) || 0);
                }
            });
        }

        if (backToSettingsBtn) {
            backToSettingsBtn.addEventListener('click', () => {
                stopTimerExecution();
                timerPanel.classList.add('hidden');
                settingsPanel.classList.remove('hidden');
            });
        }

        if (pauseResumeBtn) {
            pauseResumeBtn.addEventListener('click', () => isPaused ? resumeTimer() : pauseTimer());
        }

        if (skipStepBtn) {
            skipStepBtn.addEventListener('click', () => {
                if (rafId) cancelAnimationFrame(rafId);
                remainingMs = 0;
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                nextPhase();
            });
        }

        if (stopBtn) {
            stopBtn.addEventListener('click', () => {
                window.showModal("현재 진행 중인 루틴을 종료하시겠습니까?", () => {
                    stopTimerExecution();
                    timerPanel.classList.add('hidden');
                    settingsPanel.classList.remove('hidden');
                });
            });
        }

        let wakeLock = null;
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().catch(() => {}).finally(() => { wakeLock = null; });
            }
        }
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && timerPanel && !timerPanel.classList.contains('hidden')) {
                await requestWakeLock();
            }
        });

        function startTimerExecution(startIndex = 0) {
            currentItemIndex = startIndex;
            currentRep = 1;
            currentCycle = 1;
            isResting = false;
            restType = '';
            isPaused = false;
            resetPauseResumeBtn();
            updateOverallProgress();
            requestWakeLock();
            startPhase();
        }

        function startPhase() {
            const currentItem = routine[currentItemIndex];
            if (!currentItem) { finishRoutine(); return; }

            let phaseSeconds = 0;
            let announceText = "";

            if (isResting) {
                if (restType === 'set') {
                    currentStretchNameEl.textContent = "세트 간 휴식";
                    currentPhaseInfoEl.textContent = `다음: ${currentItem.name} (${currentRep + 1}세트)`;
                    phaseSeconds = currentItem.setRest;
                } else if (restType === 'stretch') {
                    const nextItem = routine[currentItemIndex + 1];
                    currentStretchNameEl.textContent = "종목 교체 휴식";
                    currentPhaseInfoEl.textContent = nextItem ? `다음: ${nextItem.name}` : '곧 루틴이 완료됩니다!';
                    phaseSeconds = currentItem.nextRest;
                    if (nextItem) announceText = `휴식. 다음 운동은 ${nextItem.name} 입니다.`;
                } else if (restType === 'cycle') {
                    currentStretchNameEl.textContent = "사이클 휴식";
                    currentPhaseInfoEl.textContent = `다음: ${routine[0].name} (${currentCycle + 1}회차 사이클)`;
                    phaseSeconds = cycleRestSetting;
                    announceText = `사이클 완료. ${cycleRestSetting}초간 휴식 후 다음 사이클을 시작합니다.`;
                }
                currentPhaseInfoEl.className = "text-base sm:text-lg font-semibold mb-6 h-6 text-center text-emerald-500";
                if (progressRing) progressRing.style.stroke = "#10b981";
                if (timerCircleContainer) timerCircleContainer.classList.remove('timer-active');
            } else {
                currentStretchNameEl.textContent = currentItem.name;
                currentPhaseInfoEl.textContent = `${currentRep} / ${currentItem.reps} 세트 진행 중`;
                currentPhaseInfoEl.className = "text-base sm:text-lg font-semibold mb-6 h-6 text-center text-indigo-500";
                phaseSeconds = currentItem.duration;
                if (progressRing) progressRing.style.stroke = "#6366f1";
                if (timerCircleContainer) timerCircleContainer.classList.add('timer-active');
            }

            if (phaseSeconds > 0 && announceText && soundMode === 'voice') speak(announceText);

            phaseDurationMs = phaseSeconds * 1000;
            remainingMs = phaseDurationMs;
            phaseStartTime = Date.now();
            lastUpdateTime = Date.now();
            lastAnnouncedSecond = Math.ceil(remainingMs / 1000);

            updateTimerDisplay();
            if (rafId) cancelAnimationFrame(rafId);
            if (phaseDurationMs > 0) rafId = requestAnimationFrame(timerLoop);
            else nextPhase();
        }

        function calculateTotalRemainingTime() {
            if (!routine || routine.length === 0 || currentItemIndex >= routine.length) return 0;
            let remainingSecs = Math.ceil(remainingMs / 1000);
            const currentItem = routine[currentItemIndex];
            const isLastItem = (currentItemIndex === routine.length - 1);
            
            if (isResting) {
                if (restType === 'set') {
                    let setsLeft = currentItem.reps - currentRep;
                    remainingSecs += (setsLeft * currentItem.duration) + (Math.max(0, setsLeft - 1) * currentItem.setRest);
                    if (!isLastItem) remainingSecs += currentItem.nextRest;
                }
            } else {
                let setsLeft = currentItem.reps - currentRep;
                if (setsLeft > 0) remainingSecs += (setsLeft * (currentItem.setRest + currentItem.duration));
                if (!isLastItem) remainingSecs += currentItem.nextRest;
            }
            
            for (let i = (isResting && restType === 'cycle' ? 0 : currentItemIndex + 1); i < routine.length; i++) {
                const item = routine[i];
                remainingSecs += (item.duration * item.reps) + (item.setRest * (item.reps - 1));
                if (i < routine.length - 1) remainingSecs += item.nextRest;
            }

            let cyclesLeft = totalCyclesSetting - currentCycle;
            if (isResting && restType === 'cycle') {
                cyclesLeft = totalCyclesSetting - currentCycle;
            }
            
            if (cyclesLeft > 0) {
                let oneFullCycleSecs = 0;
                routine.forEach((item, idx) => {
                    oneFullCycleSecs += (item.duration * item.reps) + (item.setRest * (item.reps - 1));
                    if (idx < routine.length - 1) oneFullCycleSecs += item.nextRest;
                });
                remainingSecs += cyclesLeft * (oneFullCycleSecs + cycleRestSetting);
            }

            return remainingSecs;
        }

        function timerLoop() {
            if (isPaused) return;
            const now = Date.now();
            remainingMs = Math.max(0, phaseDurationMs - (now - phaseStartTime));
            const ttsTriggerSecond = Math.ceil((remainingMs - 200) / 1000);
            
            if (!isResting && ttsTriggerSecond <= 3 && ttsTriggerSecond > 0 && ttsTriggerSecond !== lastAnnouncedSecond) {
                if (soundMode === 'voice') {
                    const countDownWords = ["", "하나", "둘", "셋"];
                    speak(countDownWords[ttsTriggerSecond], true);
                } else if (soundMode === 'beep') {
                    playCountdownBeep();
                }
                lastAnnouncedSecond = ttsTriggerSecond;
            }

            if (remainingMs <= 0) {
                remainingMs = 0;
                updateTimerDisplay();
                if (rafId) cancelAnimationFrame(rafId);
                playEndBeep();
                setTimeout(nextPhase, 300);
                return;
            }

            if (now - lastUpdateTime >= fpsInterval) {
                updateTimerDisplay();
                lastUpdateTime = now - ((now - lastUpdateTime) % fpsInterval);
            }
            rafId = requestAnimationFrame(timerLoop);
        }

        function nextPhase() {
            const currentItem = routine[currentItemIndex];
            if (!currentItem) { finishRoutine(); return; }

            if (isResting) {
                if (restType === 'set') {
                    isResting = false;
                    currentRep++;
                    startPhase();
                } else if (restType === 'stretch') {
                    isResting = false;
                    currentItemIndex++;
                    currentRep = 1;
                    updateOverallProgress();
                    startPhase();
                } else if (restType === 'cycle') {
                    isResting = false;
                    currentCycle++;
                    currentItemIndex = 0;
                    currentRep = 1;
                    updateOverallProgress();
                    startPhase();
                }
            } else {
                if (currentRep < currentItem.reps) {
                    restType = 'set';
                    isResting = true;
                    if (currentItem.setRest > 0) startPhase(); else nextPhase();
                } else {
                    if (currentItemIndex < routine.length - 1) {
                        restType = 'stretch';
                        isResting = true;
                        if (currentItem.nextRest > 0) startPhase(); else nextPhase();
                    } else {
                        if (currentCycle < totalCyclesSetting) {
                            restType = 'cycle';
                            isResting = true;
                            if (cycleRestSetting > 0) startPhase(); else nextPhase();
                        } else {
                            currentItemIndex++;
                            startPhase();
                        }
                    }
                }
            }
        }

        function setProgress(percent) {
            if (!progressRing) return;
            const circumference = 282.743;
            progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
            progressRing.style.strokeDashoffset = - (circumference - (percent / 100) * circumference);
        }

        function updateTimerDisplay() {
            if (timeDisplayEl) timeDisplayEl.textContent = Math.ceil(remainingMs / 1000);
            setProgress(phaseDurationMs > 0 ? (remainingMs / phaseDurationMs) * 100 : 0);

            const totalRemainingSecs = calculateTotalRemainingTime();
            if (totalRemainingTimeTextEl) {
                const totalMins = Math.floor(totalRemainingSecs / 60);
                const totalSecs = totalRemainingSecs % 60;
                totalRemainingTimeTextEl.textContent = totalMins > 0 ? `${totalMins}분 ${totalSecs}초` : `${totalSecs}초`;
            }
        }

        function updateOverallProgress() {
            if (overallProgressEl) {
                const currentStepNum = Math.min(currentItemIndex + 1, routine.length);
                overallProgressEl.textContent = `진행 단계: ${currentStepNum} / ${routine.length}`;
            }
            if (cycleIndicatorBadge) {
                cycleIndicatorBadge.textContent = `사이클 ${currentCycle} / ${totalCyclesSetting} 회차`;
            }
        }

        function pauseTimer() {
            isPaused = true;
            lastPauseTime = Date.now();
            if (rafId) cancelAnimationFrame(rafId);
            if (timerCircleContainer) timerCircleContainer.classList.remove('timer-active');
            if (pauseIcon) pauseIcon.classList.add('hidden');
            if (playIcon) playIcon.classList.remove('hidden');
            if (pauseResumeText) pauseResumeText.textContent = "계속하기";
            if (pauseResumeBtn) {
                pauseResumeBtn.classList.replace('bg-amber-500', 'bg-emerald-500');
                pauseResumeBtn.classList.replace('hover:bg-amber-600', 'hover:bg-emerald-600');
            }
        }

        function resumeTimer() {
            isPaused = false;
            phaseStartTime += (Date.now() - lastPauseTime);
            rafId = requestAnimationFrame(timerLoop);
            if (!isResting && timerCircleContainer) timerCircleContainer.classList.add('timer-active');
            if (pauseIcon) pauseIcon.classList.remove('hidden');
            if (playIcon) playIcon.classList.add('hidden');
            if (pauseResumeText) pauseResumeText.textContent = "일시정지";
            if (pauseResumeBtn) {
                pauseResumeBtn.classList.replace('bg-emerald-500', 'bg-amber-500');
                pauseResumeBtn.classList.replace('hover:bg-emerald-600', 'hover:bg-amber-600');
            }
        }

        function resetPauseResumeBtn() {
            if (pauseIcon) pauseIcon.classList.remove('hidden');
            if (playIcon) playIcon.classList.add('hidden');
            if (pauseResumeText) pauseResumeText.textContent = "일시정지";
            if (pauseResumeBtn) {
                pauseResumeBtn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600');
                pauseResumeBtn.classList.add('bg-amber-500', 'hover:bg-amber-600');
            }
        }

        function stopTimerExecution() {
            if (rafId) cancelAnimationFrame(rafId);
            if (timerCircleContainer) timerCircleContainer.classList.remove('timer-active');
            releaseWakeLock();
        }

        function finishRoutine() {
            stopTimerExecution();
            setProgress(0);
            if (timeDisplayEl) timeDisplayEl.textContent = "✨";
            if (currentStretchNameEl) currentStretchNameEl.textContent = "루틴 완료";
            if (currentPhaseInfoEl) {
                currentPhaseInfoEl.textContent = "수고하셨습니다! 모든 사이클을 완료했습니다.";
                currentPhaseInfoEl.className = "text-base sm:text-lg font-bold mb-6 h-6 text-center text-indigo-500";
            }
            if (totalRemainingTimeTextEl) totalRemainingTimeTextEl.textContent = "0초";
            playEndBeep();
            if (soundMode === 'voice') speak("수고하셨습니다. 모든 사이클 운동을 완료했습니다.");
        }
    </script>
</body>
